# ============================================
# default.conf
# Global defaults for Tag-Based-Automation
# DO NOT edit -- use custom.conf for overrides
# ============================================

# --- SCHEDULING ---
SCHEDULE="hourly"

# --- MODULE TOGGLES ---
ENABLE_PERFORMANCE=true
# ENABLE_PERMISSIONS=false  # Coming Soon

# --- LOG FILES ---
MAIN_LOG="/var/log/tag-automation.log"
SUMMARY_LOG="/var/log/tag-automation-summary.log"

# --- BASE TAG NAMES ---
CORE_BASE="0-core"
HIGH_BASE="1-high"
NORMAL_BASE="2-normal"
LOW_BASE="3-low"

# --- PERFORMANCE SETTINGS ---
CORE_WEIGHT="2048"
CORE_IO_PRI="7"

HIGH_WEIGHT="1024"
HIGH_IO_PRI="7"

NORMAL_WEIGHT="256"
NORMAL_IO_PRI="4"

LOW_WEIGHT="128"
LOW_IO_PRI="1"
