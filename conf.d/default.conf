# ============================================
# default.conf
# Base configuration for Tag-Based-Automation v1.3
# Location: /usr/local/etc/tag-automation/conf.d/default.conf
# DO NOT EDIT - Use custom.conf for overrides
# ============================================

# --- GENERAL SETTINGS ---
SCHEDULE="hourly"
TAG_SUFFIX=""

# --- MODULE TOGGLES ---
ENABLE_PERFORMANCE=true
ENABLE_PERMISSIONS=false

# --- PERFORMANCE MODULE WEIGHTS ---
CORE_WEIGHT="4096"
HIGH_WEIGHT="2048"
NORMAL_WEIGHT="512"
LOW_WEIGHT="256"

# --- DEFAULT PATHS ---
CSV_FILE="/var/lib/tag-automation/vm_metadata.csv"
LOG_FILE="/var/log/tag-automation.log"
SUMMARY_LOG="/var/log/tag-automation-summary.log"